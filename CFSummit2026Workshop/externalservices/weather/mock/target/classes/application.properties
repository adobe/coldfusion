spring.main.web-application-type=servlet

# NOTE: You must disable the banner and the console logging
# to allow the STDIO transport to work !!!
spring.main.banner-mode=off
logging.pattern.console=

# MCP Server Configuration
spring.ai.mcp.server.name=mock-weather-server
spring.ai.mcp.server.version=1.0.0

# Capability Configuration - Only Tools Enabled
# Enable tools capability (provides weather-related tools)
spring.ai.mcp.server.capabilities.tools.enabled=true

# Disable resources capability
spring.ai.mcp.server.capabilities.resources.enabled=false

# Disable prompts capability
spring.ai.mcp.server.capabilities.prompts.enabled=false

# Logging Configuration
logging.file.name=./weather-mock/target/mcp-weather-mock-server.log
logging.level.mcp.server=INFO
