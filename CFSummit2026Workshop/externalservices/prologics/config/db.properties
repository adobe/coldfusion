# ProLogics datasource registration config
# admin.password must match your local ColdFusion Administrator password.
# Override without editing this file: set the CF_ADMIN_PASSWORD environment
# variable before starting ColdFusion.
admin.password=admin

# --- SQLite (default for the workshop) -------------------------------------
# DatasourceUtil reads <name>.type and dispatches: sqlite -> setOther, mysql -> setMySQL5.
# Drop sqlite-jdbc-*.jar in cfusion/lib/ and restart CF; the datasource auto-registers.
prologics.type=sqlite
prologics.file=/Applications/cf2025/cfusion/wwwroot/CFSummit2026Workshop/externalservices/prologics/mcp/../db/sqlite/prologics.db
