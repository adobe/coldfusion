# S2 — AI Agent Configuration
# Edit values here, save, send next message. No restart needed.

# LLM Provider
provider=openai
baseUrl=https://api.openai.com/v1
modelName=gpt-4o-mini

# Sampling
temperature=0.5
topP=0.9
topK=40
maxTokens=800

# System prompt (relative to config dir)
systemPromptFile=system-prompt.txt

# Chat memory
chatMemory.type=messageWindowChatMemory
chatMemory.maxMessages=20
chatMemory.perUser=true
