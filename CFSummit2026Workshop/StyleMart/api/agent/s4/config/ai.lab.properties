# S4 MCP — AI Agent Configuration (Lab)
# Edit values here, save, send next message. No restart needed.

# LLM Provider
#provider=ollama
#baseUrl=http://localhost:11434
#modelName=llama3.1:8b
#apiKey=

provider=openai
baseUrl=https://api.openai.com/v1
modelName=gpt-4o
 

# Sampling
temperature=0.5
topP=0.9
topK=40
maxTokens=2400

# System prompt (base file, relative to config dir)
systemPromptFile=system-prompt.txt

# Prompt extensions (comma-separated, appended to base prompt)
#promptExtensions=system-prompt-weather.txt,system-prompt-logistics.txt   # system-prompt-logistics.txt is now served as an MCP prompt by prologics-logistics
promptExtensions=system-prompt-weather.txt

# Chat memory
chatMemory.type=messageWindowChatMemory
chatMemory.maxMessages=20
chatMemory.perUser=true

# CFC Tools (comma-separated dot-paths)
tools=api.agent.s4.ref.tools.SearchCatalog,api.agent.s4.ref.tools.GetProductDetails,api.agent.s4.ref.tools.CompareProducts,api.agent.s4.ref.tools.GetCart,api.agent.s4.ref.tools.GetOrderHistory,api.agent.s4.ref.tools.AddToCart

# MCP
mcpConfigFile=mcp-servers.json
weatherMode=live