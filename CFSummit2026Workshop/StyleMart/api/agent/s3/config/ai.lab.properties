# S3 Tools — AI Agent Configuration (lab side)
# Edit values here, save, send next message. No restart needed.

# LLM Provider
provider=openai
baseUrl=https://api.openai.com/v1
modelName=gpt-4o-mini

# Sampling
temperature=0.5
topP=0.9
topK=40
maxTokens=1200

# System prompt (relative to config dir)
systemPromptFile=system-prompt.txt

# Chat memory
chatMemory.type=messageWindowChatMemory
chatMemory.maxMessages=20
chatMemory.perUser=true

# CFC Tools (comma-separated dot-paths)
tools=api.agent.s3.lab.tools.SearchCatalog,api.agent.s3.lab.tools.GetProductDetails,api.agent.s3.lab.tools.CompareProducts,api.agent.s3.lab.tools.GetCart,api.agent.s3.lab.tools.GetOrderHistory,api.agent.s3.lab.tools.AddToCart,api.agent.s3.lab.tools.RemoveFromCart
